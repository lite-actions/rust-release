name: Conventional Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      base-ref:
        description: >-
          Base ref for the commit range when run manually
          (e.g. origin/main). Leave empty to check only HEAD.
        required: false
        default: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@90733d329cd6c632c7597660341002e1a1377c44 # v1.1.0
        with:
          fetch-depth: 0

      # Shared definition; the caller still owns the job, so the check is
      # still reported as `validate`. The Dependabot skip lives inside the
      # action now - its branch and commit naming is bot-controlled, and the
      # required check still needs to report as passing.
      - name: Validate conventional commits & branch
        uses: lite-actions/common-workflows/conventional-validation@v1
        with:
          base-ref: ${{ github.event.inputs.base-ref }}
