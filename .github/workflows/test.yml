name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@90733d329cd6c632c7597660341002e1a1377c44 # v1.1.0

      # Shared definition; the caller still owns the job, so the check is
      # still reported as `test`.
      - name: Run script tests
        uses: lite-actions/common-workflows/shell-test@v1
